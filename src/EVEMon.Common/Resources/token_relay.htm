<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVE 授权完成 - EVEMon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 500px;
            margin: 20px;
        }
        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4aa 0%, #00a87d 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(0,212,170,0.3);
        }
        .success-icon svg { width: 40px; height: 40px; fill: #fff; }
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 12px; }
        p { color: rgba(255,255,255,0.7); line-height: 1.6; font-size: 14px; }
        .token-preview {
            margin-top: 20px;
            padding: 12px 16px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            font-family: 'Consolas', monospace;
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            word-break: break-all;
            text-align: left;
            max-height: 60px;
            overflow: hidden;
        }
        .loading {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #00d4aa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { display: none; }
        .error .success-icon {
            background: linear-gradient(135deg, #ff6b6b 0%, #c92a2a 100%);
            box-shadow: 0 0 30px rgba(255,107,107,0.3);
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container" id="success">
        <div class="success-icon">
            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </div>
        <h1>授权成功</h1>
        <p>EVEMon 已成功获取访问权限。<br>正在完成登录流程，请稍候...</p>
        <div class="loading">
            <div class="spinner"></div>
            <span style="font-size:12px;opacity:0.6;">正在传输授权信息...</span>
        </div>
    </div>

    <div class="container error" id="error">
        <div class="success-icon">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </div>
        <h1>授权失败</h1>
        <p id="errorMsg">处理授权信息时发生错误。</p>
    </div>

    <script>
    (function() {
        var LOCAL_TOKEN_ENDPOINT = 'http://localhost:4916/token';
        var TIMEOUT_MS = 8000;
        var timer;

        function parseFragment() {
            var hash = window.location.hash;
            if (!hash || hash === '#') return null;
            var params = {};
            hash.substring(1).split('&').forEach(function(pair) {
                var kv = pair.split('=');
                if (kv[0]) params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
            });
            return params;
        }

        function postToken(data) {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', LOCAL_TOKEN_ENDPOINT, true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    clearTimeout(timer);
                    if (xhr.status === 200) {
                        showSuccess();
                    } else {
                        showError('无法完成授权流程 (HTTP ' + xhr.status + ')');
                    }
                }
            };
            xhr.onerror = function() {
                clearTimeout(timer);
                showError('无法连接到 EVEMon，请确保程序正在运行');
            };
            xhr.send(JSON.stringify(data));
            // Backup: if no response in time, just show success
            timer = setTimeout(function() {
                showSuccess();
            }, TIMEOUT_MS);
        }

        function showSuccess() {
            document.getElementById('success').style.display = 'block';
            document.getElementById('error').style.display = 'none';
        }

        function showError(msg) {
            document.getElementById('success').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('errorMsg').textContent = msg;
        }

        var params = parseFragment();
        if (params && params.access_token) {
            postToken({
                access_token: params.access_token,
                token_type: params.token_type || 'Bearer',
                expires_in: parseInt(params.expires_in) || 0,
                state: params.state || ''
            });
        } else {
            showError('未找到授权令牌，请重试');
        }
    })();
    </script>
</body>
</html>
